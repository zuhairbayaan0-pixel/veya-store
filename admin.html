<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEYA Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f2;
color:#171717
}

header{
background:#171717;
color:white;
padding:22px 6%;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:24px;
font-weight:bold;
letter-spacing:6px
}

header a{
color:white;
text-decoration:none
}

.container{
max-width:1000px;
margin:40px auto;
padding:0 20px
}

.card{
background:white;
padding:30px;
border-radius:12px;
margin-bottom:25px;
box-shadow:0 3px 15px #0000000f
}

h1{
margin-top:0
}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px
}

textarea{
min-height:110px;
resize:vertical
}

.help{
font-size:13px;
color:#777;
margin-top:6px
}

.image-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:10px
}

.image-box{
border:1px solid #ddd;
padding:10px;
border-radius:8px;
background:#fafafa
}

.image-box input{
padding:8px;
font-size:13px
}

.preview{
width:100%;
height:140px;
object-fit:cover;
border-radius:6px;
margin-top:8px;
display:none
}

.option-row{
display:flex;
gap:8px;
margin-top:8px
}

.option-row input{
flex:1
}

.remove-option{
background:#eee;
border:0;
padding:10px 13px;
border-radius:6px;
cursor:pointer
}

.add-option{
margin-top:10px;
background:#eee;
border:0;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
font-weight:bold
}

.publish{
background:#171717;
color:white;
width:100%;
margin-top:25px;
border:0;
border-radius:6px;
padding:15px;
cursor:pointer;
font-weight:bold;
font-size:15px
}

.status{
margin-top:15px;
color:#666
}

.product{
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:8px
}

.product-top{
display:flex;
gap:15px;
align-items:flex-start
}

.product img{
width:100px;
height:100px;
object-fit:cover;
border-radius:6px
}

.product-info{
flex:1
}

.product h3{
margin:0 0 7px
}

.product p{
margin:5px 0;
color:#666
}

.product-images{
display:flex;
gap:7px;
margin-top:12px;
overflow:auto
}

.product-images img{
width:70px;
height:70px;
object-fit:cover;
border-radius:5px
}

.delete{
background:#eee;
border:0;
padding:10px 14px;
border-radius:6px;
cursor:pointer
}

@media(max-width:700px){

.image-grid{
grid-template-columns:1fr
}

.product-top{
flex-direction:column
}

}

</style>
</head>

<body>

<header>

<div class="logo">VEYA</div>

<a href="index.html">
View Store →
</a>

</header>


<div class="container">


<div class="card">

<h1>Add Product</h1>


<label>
Product Name
</label>

<input
id="name"
placeholder="Example: Classic Hoodie"
>


<label>
Category
</label>

<select id="category">

<option>Clothing</option>
<option>Purses</option>
<option>Glasses</option>
<option>Watches</option>
<option>Jewellery</option>

</select>


<label>
Price (PKR)
</label>

<input
id="price"
type="number"
placeholder="1499"
>


<label>
Stock Quantity
</label>

<input
id="stock"
type="number"
min="0"
placeholder="20"
>

<div class="help">
How many units are available to sell.
</div>


<label>
Description
</label>

<textarea
id="description"
placeholder="Describe your product..."
></textarea>


<label>
Product Images — up to 6
</label>

<div class="help">
Select up to six images from your computer.
</div>

<div class="image-grid">

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,0)">
<img class="preview" id="preview0">
</div>

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,1)">
<img class="preview" id="preview1">
</div>

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,2)">
<img class="preview" id="preview2">
</div>

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,3)">
<img class="preview" id="preview3">
</div>

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,4)">
<img class="preview" id="preview4">
</div>

<div class="image-box">
<input type="file" accept="image/*" onchange="previewImage(this,5)">
<img class="preview" id="preview5">
</div>

</div>


<label>
Colors
</label>

<div id="colors">

<div class="option-row">

<input
class="color-input"
placeholder="Example: Black"
>

</div>

</div>

<button
class="add-option"
type="button"
onclick="addColor()"
>
+ Add another color
</button>


<label>
Sizes
</label>

<div class="help">
For clothing, enter sizes such as S, M, L, XL. For other products, leave this empty.
</div>

<div id="sizes">

<div class="option-row">

<input
class="size-input"
placeholder="Example: S"
>

</div>

</div>

<button
class="add-option"
type="button"
onclick="addSize()"
>
+ Add another size
</button>


<button
class="publish"
onclick="addProduct()"
>
PUBLISH PRODUCT
</button>

<div
class="status"
id="status"
></div>

</div>


<div class="card">

<h1>
Your Products
</h1>

<div id="products">
Loading...
</div>

</div>

</div>


<script>

const db =
supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_KEY
);


/* IMAGE FILES */

const imageFiles = [
null,
null,
null,
null,
null,
null
];


function previewImage(input,index){

const file =
input.files[0];

if(!file){

return;
}

imageFiles[index] =
file;

const preview =
document.getElementById(
"preview"+index
);

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

}


/* COLORS */

function addColor(){

const row =
document.createElement("div");

row.className =
"option-row";

row.innerHTML = `

<input
class="color-input"
placeholder="Example: White"
>

<button
class="remove-option"
type="button"
onclick="this.parentElement.remove()"
>
×
</button>

`;

document
.getElementById("colors")
.appendChild(row);

}


/* SIZES */

function addSize(){

const row =
document.createElement("div");

row.className =
"option-row";

row.innerHTML = `

<input
class="size-input"
placeholder="Example: M"
>

<button
class="remove-option"
type="button"
onclick="this.parentElement.remove()"
>
×
</button>

`;

document
.getElementById("sizes")
.appendChild(row);

}


/* UPLOAD IMAGE */

async function uploadImage(file){

const extension =
file.name
.split(".")
.pop();

const filename =
Date.now()
+
"-"
+
Math.random()
.toString(36)
.substring(2)
+
"."
+
extension;


const path =
filename;


const {
error
} =
await db
.storage
.from("product-images")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false
}
);


if(error){

throw error;

}


const {
data
} =
db
.storage
.from("product-images")
.getPublicUrl(path);


return data.publicUrl;

}


/* ADD PRODUCT */

async function addProduct(){

const status =
document.getElementById("status");


const name =
document
.getElementById("name")
.value
.trim();


const category =
document
.getElementById("category")
.value;


const price =
Number(
document
.getElementById("price")
.value
);


const stock =
Number(
document
.getElementById("stock")
.value
);


const description =
document
.getElementById("description")
.value
.trim();


const colors =
[
...document.querySelectorAll(
".color-input"
)
]
.map(x=>x.value.trim())
.filter(Boolean);


const sizes =
[
...document.querySelectorAll(
".size-input"
)
]
.map(x=>x.value.trim())
.filter(Boolean);


if(!name){

status.textContent =
"Please enter a product name.";

return;
}


if(!price || price < 0){

status.textContent =
"Please enter a valid price.";

return;
}


if(stock < 0 || Number.isNaN(stock)){

status.textContent =
"Please enter a valid stock quantity.";

return;
}


if(
category === "Clothing"
&&
!sizes.length
){

status.textContent =
"Please add at least one size for clothing.";

return;
}


const selectedFiles =
imageFiles.filter(Boolean);


if(!selectedFiles.length){

status.textContent =
"Please select at least one product image.";

return;
}


if(selectedFiles.length > 6){

status.textContent =
"You can upload a maximum of 6 images.";

return;
}


try{

status.textContent =
"Uploading images...";


const imageUrls = [];


for(
const file
of selectedFiles
){

const url =
await uploadImage(file);

imageUrls.push(url);

}


status.textContent =
"Publishing product...";


const {
error
} =
await db
.from("products")
.insert({

name:name,

category:category,

price:price,

description:description,

image_url:
imageUrls[0],

image_urls:
imageUrls,

stock_quantity:
stock,

colors:
colors,

sizes:
sizes,

has_sizes:
sizes.length > 0

});


if(error){

throw error;

}


status.textContent =
"✅ Product published successfully!";


/* RESET */

document
.getElementById("name")
.value = "";

document
.getElementById("price")
.value = "";

document
.getElementById("stock")
.value = "";

document
.getElementById("description")
.value = "";


for(
let i=0;
i<6;
i++
){

imageFiles[i] =
null;

const preview =
document.getElementById(
"preview"+i
);

preview.src = "";

preview.style.display =
"none";

}


document
.querySelectorAll(
'input[type="file"]'
)
.forEach(
input=>input.value=""
);


document.getElementById("colors").innerHTML = `

<div class="option-row">

<input
class="color-input"
placeholder="Example: Black"
>

</div>

`;


document.getElementById("sizes").innerHTML = `

<div class="option-row">

<input
class="size-input"
placeholder="Example: S"
>

</div>

`;


loadProducts();


}catch(error){

console.error(error);

status.textContent =
"❌ "
+
error.message;

}

}


/* LOAD PRODUCTS */

async function loadProducts(){

const box =
document.getElementById(
"products"
);


const {
data,
error
} =
await db
.from("products")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

box.innerHTML =
"<p>Could not load products: "
+
error.message
+
"</p>";

return;
}


if(!data.length){

box.innerHTML =
"<p>No products yet.</p>";

return;
}


box.innerHTML =
data.map(p=>{

let images = [];


try{

if(
Array.isArray(p.image_urls)
){

images =
p.image_urls;

}

else if(
typeof p.image_urls ===
"string"
){

images =
JSON.parse(
p.image_urls
);

}

}catch(e){}


if(
!images.length &&
p.image_url
){

images =
[p.image_url];

}


const colors =
Array.isArray(p.colors)
?
p.colors
:
[];


const sizes =
Array.isArray(p.sizes)
?
p.sizes
:
[];


return `

<div class="product">

<div class="product-top">

${
images.length

?

`<img
src="${escapeHTML(images[0])}"
>`

:

""

}


<div class="product-info">

<h3>
${escapeHTML(p.name)}
</h3>

<p>
Category:
${escapeHTML(p.category || "")}
</p>

<p>
Price:
PKR
${Number(p.price || 0).toLocaleString()}
</p>

<p>
Stock:
${Number(p.stock_quantity || 0)}
</p>

<p>
${escapeHTML(p.description || "")}
</p>

<p>
<b>Colors:</b>
${
colors.length
?
colors.map(escapeHTML).join(", ")
:
"None"
}
</p>

<p>
<b>Sizes:</b>
${
sizes.length
?
sizes.map(escapeHTML).join(", ")
:
"None"
}
</p>

</div>


<button
class="delete"
onclick="deleteProduct(${p.id})"
>
Delete
</button>

</div>


<div class="product-images">

${
images.map(
img=>
`
<img
src="${escapeHTML(img)}"
>
`
).join("")
}

</div>

</div>

`;

}).join("");

}


/* DELETE */

async function deleteProduct(id){

if(
!confirm(
"Delete this product?"
)
){

return;
}


const {
error
} =
await db
.from("products")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;
}


loadProducts();

}


/* ESCAPE */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


loadProducts();

</script>

</body>
</html>
