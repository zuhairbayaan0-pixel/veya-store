<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEYA Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f2;
  color:#171717;
}

header{
  background:#171717;
  color:white;
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:6px;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:7px;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:6px;
  padding:13px 20px;
  cursor:pointer;
  font-weight:bold;
}

.publish{
  background:#171717;
  color:white;
  width:100%;
  margin-top:22px;
}

.product{
  border:1px solid #ddd;
  padding:18px;
  margin-top:15px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.product-info{
  flex:1;
}

.product h3{
  margin:0 0 7px;
}

.product p{
  margin:5px 0;
  color:#777;
}

.delete{
  background:#eee;
}

.status{
  margin-top:15px;
  color:#666;
}

.back{
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="logo">VEYA</div>
  <a class="back" href="/">View Store →</a>
</header>

<div class="container">

  <div class="card">

    <h1>Add Product</h1>

    <label>Product Name</label>

    <input
      id="name"
      type="text"
      placeholder="Example: Mini Humidifier"
    >

    <label>Price (PKR)</label>

    <input
      id="price"
      type="number"
      placeholder="1499"
    >

    <label>Description</label>

    <textarea
      id="description"
      placeholder="Describe your product..."
    ></textarea>

    <label>Image URL</label>

    <input
      id="image"
      type="url"
      placeholder="https://example.com/product.jpg"
    >

    <button
      class="publish"
      onclick="addProduct()">
      PUBLISH PRODUCT
    </button>

    <div class="status" id="status"></div>

  </div>


  <div class="card">

    <h1>Your Products</h1>

    <div id="products">
      Loading...
    </div>

  </div>

</div>


<script>

async function loadProducts(){

  const box =
    document.getElementById("products");

  try{

    const response =
      await fetch("/.netlify/functions/products");

    const products =
      await response.json();

    if(!products.length){

      box.innerHTML =
        "<p>No products yet.</p>";

      return;

    }

    box.innerHTML =
      products.map(product => `

        <div class="product">

          <div class="product-info">

            <h3>${escapeHTML(product.name)}</h3>

            <p>
              PKR ${Number(product.price).toLocaleString()}
            </p>

            <p>
              ${escapeHTML(product.description || "")}
            </p>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})">
            Delete
          </button>

        </div>

      `).join("");

  }catch(error){

    box.innerHTML =
      "<p>Could not load products.</p>";

  }

}


async function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value;

  const description =
    document.getElementById("description").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const status =
    document.getElementById("status");


  if(!name || !price){

    status.textContent =
      "Please enter a product name and price.";

    return;

  }


  status.textContent =
    "Publishing...";


  try{

    const response =
      await fetch(
        "/.netlify/functions/products",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            name,
            price,
            description,
            image
          })
        }
      );


    if(!response.ok){

      throw new Error("Failed");

    }


    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("description").value="";
    document.getElementById("image").value="";


    status.textContent =
      "✅ Product published!";


    loadProducts();

  }catch(error){

    status.textContent =
      "❌ Could not publish product.";

  }

}


async function deleteProduct(id){

  if(!confirm("Delete this product?")){

    return;

  }


  await fetch(
    "/.netlify/functions/products",
    {
      method:"DELETE",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({id})
    }
  );


  loadProducts();

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


loadProducts();

</script>

</body>
</html>
