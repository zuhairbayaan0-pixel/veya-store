<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEYA Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f2;
  color:#171717;
}

header{
  background:#171717;
  color:white;
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:6px;
}

header a{
  color:white;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:12px;
  margin-bottom:25px;
  box-shadow:0 3px 15px #0000000f;
}

h1{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

input[type="file"]{
  background:#fafafa;
  cursor:pointer;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.help{
  font-size:13px;
  color:#777;
  margin-top:7px;
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.preview-box{
  position:relative;
}

.preview-box img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.preview-number{
  position:absolute;
  top:6px;
  left:6px;
  background:#171717;
  color:white;
  padding:4px 7px;
  border-radius:5px;
  font-size:12px;
}

button{
  border:0;
  border-radius:6px;
  padding:13px 20px;
  cursor:pointer;
  font-weight:bold;
}

.publish{
  background:#171717;
  color:white;
  width:100%;
  margin-top:22px;
}

.publish:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.product{
  border:1px solid #ddd;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
  display:flex;
  gap:15px;
}

.product-images{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  width:180px;
  flex-shrink:0;
}

.product-images img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:5px;
}

.product-info{
  flex:1;
}

.product h3{
  margin:0 0 7px;
}

.product p{
  margin:5px 0;
  color:#777;
}

.delete{
  background:#eee;
  height:max-content;
}

.status{
  margin-top:15px;
  color:#666;
}

@media(max-width:600px){

  .preview-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .product{
    display:block;
  }

  .product-images{
    width:100%;
    margin-bottom:12px;
  }

}
</style>
</head>

<body>

<header>

<div class="logo">VEYA</div>

<a href="index.html">
View Store →
</a>

</header>


<div class="container">


<div class="card">

<h1>Add Product</h1>


<label>Product Name</label>

<input
id="name"
type="text"
placeholder="Example: Classic Shoulder Bag"
>


<label>Category</label>

<select id="category">

<option>Clothing</option>
<option>Purses</option>
<option>Glasses</option>
<option>Watches</option>
<option>Jewellery</option>

</select>


<label>Price (PKR)</label>

<input
id="price"
type="number"
min="0"
placeholder="1499"
>


<label>Description</label>

<textarea
id="description"
placeholder="Describe your product..."
></textarea>


<label>Product Images</label>

<input
id="imageFiles"
type="file"
accept="image/*"
multiple
>

<div class="help">
Choose up to 6 images. The first image will be the main product image.
</div>


<div
id="previewGrid"
class="preview-grid">
</div>


<label>Stock Quantity</label>

<input
id="stockQuantity"
type="number"
min="0"
value="0"
placeholder="Example: 25"
>


<button
id="publishButton"
class="publish"
onclick="addProduct()"
>
PUBLISH PRODUCT
</button>


<div
id="status"
class="status">
</div>

</div>


<div class="card">

<h1>Your Products</h1>

<div id="products">
Loading...
</div>

</div>


</div>


<script>

const db =
supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_KEY
);


/* SELECTED IMAGE PREVIEWS */

document
.getElementById("imageFiles")
.addEventListener("change", function(){

  const files =
    Array.from(this.files);

  const previewGrid =
    document.getElementById(
      "previewGrid"
    );

  previewGrid.innerHTML = "";


  if(files.length > 6){

    alert(
      "You can select a maximum of 6 images."
    );

    this.value = "";

    return;
  }


  files.forEach((file,index)=>{

    if(!file.type.startsWith("image/")){
      return;
    }


    const box =
      document.createElement("div");

    box.className =
      "preview-box";


    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);


    const number =
      document.createElement("div");

    number.className =
      "preview-number";

    number.textContent =
      "Image " + (index + 1);


    box.appendChild(img);

    box.appendChild(number);

    previewGrid.appendChild(box);

  });

});


/* LOAD PRODUCTS */

async function loadProducts(){

  const box =
    document.getElementById(
      "products"
    );

  box.innerHTML =
    "Loading...";


  const {
    data,
    error
  } =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    box.innerHTML =
      "<p>Could not load products: "
      +
      escapeHTML(
        error.message
      )
      +
      "</p>";

    return;
  }


  if(!data || !data.length){

    box.innerHTML =
      "<p>No products yet.</p>";

    return;
  }


  box.innerHTML =
    data.map(p=>{

      let images = [];

      try{

        if(
          Array.isArray(
            p.image_urls
          )
        ){

          images =
            p.image_urls;

        }else if(
          typeof p.image_urls ===
          "string"
        ){

          images =
            JSON.parse(
              p.image_urls
            );

        }

      }catch(e){

        images = [];

      }


      if(
        !images.length &&
        p.image_url
      ){

        images =
          [p.image_url];

      }


      const stock =
        Number(
          p.stock_quantity || 0
        );


      return `

      <div class="product">

        <div class="product-images">

          ${
            images.map(url=>`

              <img
                src="${escapeHTML(url)}"
                alt="${escapeHTML(p.name)}"
              >

            `).join("")
          }

        </div>


        <div class="product-info">

          <h3>
            ${escapeHTML(p.name)}
          </h3>

          <p>
            ${escapeHTML(
              p.category || ""
            )}
          </p>

          <p>
            PKR ${
              Number(
                p.price || 0
              ).toLocaleString()
            }
          </p>

          <p>
            ${escapeHTML(
              p.description || ""
            )}
          </p>

          <p>
            <strong>
              Stock:
            </strong>
            ${stock}
          </p>

          <p>
            <strong>
              Images:
            </strong>
            ${images.length}
          </p>

        </div>


        <button
          class="delete"
          onclick="deleteProduct(${p.id})"
        >
          Delete
        </button>

      </div>

      `;

    }).join("");

}


/* ADD PRODUCT */

async function addProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const price =
    document
      .getElementById("price")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const fileInput =
    document.getElementById(
      "imageFiles"
    );


  const files =
    Array.from(
      fileInput.files
    );


  const stock =
    document
      .getElementById(
        "stockQuantity"
      )
      .value;


  const status =
    document.getElementById(
      "status"
    );


  const publishButton =
    document.getElementById(
      "publishButton"
    );


  /* VALIDATION */

  if(!name){

    status.textContent =
      "Please enter a product name.";

    return;
  }


  if(
    !price ||
    Number(price) < 0
  ){

    status.textContent =
      "Please enter a valid price.";

    return;
  }


  if(!files.length){

    status.textContent =
      "Please choose at least one image.";

    return;
  }


  if(files.length > 6){

    status.textContent =
      "You can upload a maximum of 6 images.";

    return;
  }


  if(
    stock === "" ||
    Number(stock) < 0
  ){

    status.textContent =
      "Please enter a valid stock quantity.";

    return;
  }


  for(const file of files){

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      status.textContent =
        "Only image files are allowed.";

      return;
    }


    if(
      file.size >
      5 * 1024 * 1024
    ){

      status.textContent =
        "Each image must be smaller than 5MB.";

      return;
    }

  }


  publishButton.disabled =
    true;


  status.textContent =
    "Uploading images...";


  const uploadedUrls = [];

  const uploadedFiles = [];


  try{

    /* UPLOAD ALL IMAGES */

    for(
      let i = 0;
      i < files.length;
      i++
    ){

      const file =
        files[i];


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        Date.now()
        +
        "-"
        +
        i
        +
        "-"
        +
        Math.random()
          .toString(36)
          .substring(2,10)
        +
        "."
        +
        extension;


      status.textContent =
        "Uploading image "
        +
        (i + 1)
        +
        " of "
        +
        files.length
        +
        "...";


      const {
        error:uploadError
      } =
        await db.storage
          .from("product-images")
          .upload(
            fileName,
            file,
            {
              cacheControl:"3600",
              upsert:false,
              contentType:file.type
            }
          );


      if(uploadError){

        throw new Error(
          "Image upload failed: "
          +
          uploadError.message
        );

      }


      uploadedFiles.push(
        fileName
      );


      const {
        data:publicUrlData
      } =
        db.storage
          .from("product-images")
          .getPublicUrl(
            fileName
          );


      uploadedUrls.push(
        publicUrlData.publicUrl
      );

    }


    status.textContent =
      "Saving product...";


    /* SAVE PRODUCT */

    const {
      error:productError
    } =
      await db
        .from("products")
        .insert({

          name:name,

          category:category,

          price:Number(price),

          description:description,

          image_url:
            uploadedUrls[0],

          image_urls:
            uploadedUrls,

          stock_quantity:
            Number(stock)

        });


    if(productError){

      /* DELETE UPLOADED IMAGES
         IF PRODUCT SAVE FAILS */

      if(
        uploadedFiles.length
      ){

        await db.storage
          .from("product-images")
          .remove(
            uploadedFiles
          );

      }


      throw new Error(
        "Product could not be saved: "
        +
        productError.message
      );

    }


    /* CLEAR FORM */

    document
      .getElementById("name")
      .value = "";


    document
      .getElementById("price")
      .value = "";


    document
      .getElementById(
        "description"
      )
      .value = "";


    document
      .getElementById(
        "imageFiles"
      )
      .value = "";


    document
      .getElementById(
        "stockQuantity"
      )
      .value = "0";


    document
      .getElementById(
        "previewGrid"
      )
      .innerHTML = "";


    status.textContent =
      "✅ Product published successfully!";


    await loadProducts();


  }catch(error){

    console.error(error);

    status.textContent =
      "❌ "
      +
      error.message;

  }


  publishButton.disabled =
    false;

}


/* DELETE PRODUCT */

async function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;
  }


  const {
    data:product,
    error:findError
  } =
    await db
      .from("products")
      .select(
        "image_url,image_urls"
      )
      .eq("id",id)
      .single();


  if(findError){

    alert(
      findError.message
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      error.message
    );

    return;
  }


  /* TRY TO DELETE IMAGES */

  try{

    let urls = [];


    if(
      Array.isArray(
        product.image_urls
      )
    ){

      urls =
        product.image_urls;

    }else if(
      typeof product.image_urls ===
      "string"
    ){

      urls =
        JSON.parse(
          product.image_urls
        );

    }


    if(
      !urls.length &&
      product.image_url
    ){

      urls =
        [product.image_url];

    }


    const filesToDelete = [];


    urls.forEach(url=>{

      try{

        const parsed =
          new URL(url);


        const marker =
          "/storage/v1/object/public/product-images/";


        const index =
          parsed.pathname.indexOf(
            marker
          );


        if(index !== -1){

          filesToDelete.push(
            parsed.pathname.substring(
              index + marker.length
            )
          );

        }

      }catch(e){

        console.log(
          "Could not parse image URL"
        );

      }

    });


    if(
      filesToDelete.length
    ){

      await db.storage
        .from("product-images")
        .remove(
          filesToDelete
        );

    }

  }catch(e){

    console.log(
      "Image cleanup skipped:",
      e
    );

  }


  loadProducts();

}


/* ESCAPE HTML */

function escapeHTML(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* START */

loadProducts();

</script>

</body>
</html>
