<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEYA Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f2;color:#171717}
header{background:#171717;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;letter-spacing:6px}
header a{color:white}
.container{max-width:900px;margin:40px auto;padding:0 20px}
.card{background:white;padding:30px;border-radius:12px;margin-bottom:25px;box-shadow:0 3px 15px #0000000f}
h1{margin-top:0}
label{display:block;font-weight:bold;margin-top:18px;margin-bottom:7px}
input,textarea,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:6px;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:6px;padding:13px 20px;cursor:pointer;font-weight:bold}
.publish{background:#171717;color:white;width:100%;margin-top:22px}
.product{border:1px solid #ddd;padding:15px;margin-top:15px;border-radius:8px;display:flex;justify-content:space-between;gap:15px}
.product img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.product-info{flex:1}.product h3{margin:0 0 7px}.product p{margin:5px 0;color:#777}
.delete{background:#eee}.status{margin-top:15px;color:#666}
</style>
</head>

<body>

<header>
<div class="logo">VEYA</div>
<a href="index.html">View Store →</a>
</header>

<div class="container">

<div class="card">
<h1>Add Product</h1>

<label>Product Name</label>
<input id="name" placeholder="Example: Classic Shoulder Bag">

<label>Category</label>
<select id="category">
<option>Clothing</option>
<option>Purses</option>
<option>Glasses</option>
<option>Watches</option>
<option>Jewellery</option>
</select>

<label>Price (PKR)</label>
<input id="price" type="number" placeholder="1499">

<label>Description</label>
<textarea id="description" placeholder="Describe your product..."></textarea>

<label>Product Image URL</label>
<input id="image" type="url" placeholder="https://...">

<p style="font-size:13px;color:#777">
For now, use an image URL. You can upload your product image to an image-hosting service and paste its direct image URL here.
</p>

<button class="publish" onclick="addProduct()">PUBLISH PRODUCT</button>

<div class="status" id="status"></div>
</div>

<div class="card">
<h1>Your Products</h1>
<div id="products">Loading...</div>
</div>

</div>

<script>
const db=supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_KEY
);

async function loadProducts(){

const box=document.getElementById("products");

const {data,error}=await db
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){
box.innerHTML="<p>Could not load products: "+error.message+"</p>";
return;
}

if(!data.length){
box.innerHTML="<p>No products yet.</p>";
return;
}

box.innerHTML=data.map(p=>`

<div class="product">

${p.image_url?
`<img src="${escapeHTML(p.image_url)}">`
:""}

<div class="product-info">

<h3>${escapeHTML(p.name)}</h3>

<p>
${escapeHTML(p.category)}
</p>

<p>
PKR ${Number(p.price).toLocaleString()}
</p>

<p>
${escapeHTML(p.description||"")}
</p>

</div>

<button class="delete"
onclick="deleteProduct(${p.id})">
Delete
</button>

</div>

`).join("");

}


async function addProduct(){

const name=document.getElementById("name").value.trim();
const category=document.getElementById("category").value;
const price=document.getElementById("price").value;
const description=document.getElementById("description").value.trim();
const image=document.getElementById("image").value.trim();
const status=document.getElementById("status");

if(!name||!price){
status.textContent="Please enter product name and price.";
return;
}

status.textContent="Publishing...";

const {error}=await db
.from("products")
.insert({
name,
category,
price:Number(price),
description,
image_url:image
});

if(error){
status.textContent="❌ "+error.message;
return;
}

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("image").value="";

status.textContent="✅ Product published!";

loadProducts();

}


async function deleteProduct(id){

if(!confirm("Delete this product?")) return;

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadProducts();

}


function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

loadProducts();
</script>

</body>
</html>
